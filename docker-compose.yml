services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "1031:1031"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "1324:80"
    environment:
      - APP_ENV=local
      - APP_PORT=80
      - GOFF_ENDPOINT=http://relay:1031
    depends_on:
      - relay
    restart: unless-stopped

networks:
  default:
    name: flags_local
    external: true
