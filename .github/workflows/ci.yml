name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run tests
        run: go test ./... -race -coverprofile=coverage.out

      - name: Run vet
        run: go vet ./...

  relay:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Checkout git-actions
        uses: actions/checkout@v4
        with:
          repository: develogo/git-actions
          token: ${{ secrets.STACKS_REPO_TOKEN }}
          path: git-actions

      - name: Build, push and open PR in stacks
        uses: ./git-actions/actions/build_push_and_update_stacks
        with:
          image_name: flags-relay
          image_repo: develogo/flags-relay
          stacks_repo: develogo/stacks
          stacks_compose_path: stacks/flags/docker-compose.yml
          stacks_repo_token: ${{ secrets.STACKS_REPO_TOKEN }}
          dockerfile_path: Dockerfile
          context: .
          platforms: linux/amd64

  api:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Checkout git-actions
        uses: actions/checkout@v4
        with:
          repository: develogo/git-actions
          token: ${{ secrets.STACKS_REPO_TOKEN }}
          path: git-actions

      - name: Build, push and open PR in stacks
        uses: ./git-actions/actions/build_push_and_update_stacks
        with:
          image_name: flags-api
          image_repo: develogo/flags-api
          stacks_repo: develogo/stacks
          stacks_compose_path: stacks/flags/docker-compose.yml
          stacks_repo_token: ${{ secrets.STACKS_REPO_TOKEN }}
          dockerfile_path: Dockerfile.api
          context: .
          platforms: linux/amd64
