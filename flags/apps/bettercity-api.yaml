# ===== BETTERCITY API (Go) =====
# Values compensate the API-side Earth-radius fix (better-city-api-go PR #20):
# previously calcDistanceInMeters scaled distances by ~0.215× due to a wrong
# constant, so 25000 effectively gated viewports of ~116 km real diagonal.
# After the API fix, calcDistanceInMeters returns real meters — these numbers
# are multiplied by 6371/1371 ≈ 4.647 to preserve the prior operational limits.
max_viewport_diagonal_meters:
  variations:
    small: 37000
    medium: 116000
    large: 232000
  defaultRule:
    variation: medium

# Kill switch for scan-mitigation security middlewares (BadPathBlocklist +
# RateLimiter). Default enabled. Flip to disabled for emergency rollback
# without redeploy — CF remains first line of defense.
security_middlewares_enabled:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: enabled

maintenance_mode:
  variations:
    active: true
    inactive: false
  defaultRule:
    variation: inactive

redis_cache_enabled:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: enabled

log_level:
  variations:
    debug: "debug"
    info: "info"
    warn: "warn"
    error: "error"
  defaultRule:
    variation: warn

rate_limit_enabled:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: enabled

