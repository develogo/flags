# ===== BETTERCITY FLUTTER =====
dark_mode:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: disabled

maintenance_mode:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: disabled

feedback_enabled:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: enabled

force_update_enabled:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: enabled

minimum_app_version:
  variations:
    version: "1.1.2"
  defaultRule:
    variation: version

